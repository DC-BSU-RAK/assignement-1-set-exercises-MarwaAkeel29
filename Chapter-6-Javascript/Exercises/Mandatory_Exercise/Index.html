<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eco Drive Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator-container">
    <h1>Eco Drive Challenge</h1>
    
    <div class="form-group">
      <label for="price">Petrol Price (per liter):</label>
      <input type="number" id="price" value="1.72" step="0.01" />
    </div>

    <div class="form-group">
      <label for="liters">Liters Purchased:</label>
      <input type="number" id="liters" value="0" />
    </div>

    <div class="form-group">
      <label for="distance">Trip Distance (km):</label>
      <input type="number" id="distance" placeholder="Enter distance..." />
    </div>

    <button id="calculateBtn">Calculate</button>

    <div id="results">
      <p id="costOutput">Total Cost: £0.00</p>
      <p id="efficiencyOutput">Efficiency: -- km/l</p>
      <p id="emissionsOutput">CO₂ Emissions: -- kg</p>
      <p id="scoreOutput">Eco Score: -- / 100</p>
      <p id="badgeOutput">Badges: --</p>
      <p id="tipOutput">Tip: --</p>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
